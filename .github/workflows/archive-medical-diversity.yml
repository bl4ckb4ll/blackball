name: Archive the CC-BY medical-diversity source

on:
  push:
    branches: [notes/professional-class-fast-track-20261012]
    paths: [.github/workflows/archive-medical-diversity.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-medical-diversity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'bl4ckb4ll/blackball' && github.ref == 'refs/heads/notes/professional-class-fast-track-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acquire and verify the licensed publisher version from NLM
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          'use strict';
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { execFileSync, spawnSync } = require('node:child_process');
          const repository = process.env.GITHUB_REPOSITORY;
          const branch = process.env.GITHUB_REF_NAME;
          const folder = 'texts/medical-student-socioeconomic-diversity/2022';
          const doi = '10.1001/jamanetworkopen.2022.2621';
          const origin = 'https://pmc-oa-opendata.s3.amazonaws.com';
          const digest = (data, algorithm = 'sha256') => crypto.createHash(algorithm).update(data).digest('hex');
          async function remote(url) {
            const r = await fetch(url, { signal: AbortSignal.timeout(60000), headers: { 'User-Agent': 'Blackball-source-preservation/1.0' } });
            if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
            return r;
          }
          function sourceURL(raw) {
            const url = new URL(String(raw).replace(/^s3:\/\/pmc-oa-opendata\//, origin + '/'));
            if (url.protocol !== 'https:' || url.hostname !== 'pmc-oa-opendata.s3.amazonaws.com' || !url.pathname.startsWith('/PMC8924719.')) throw new Error('Source URL is outside the named NLM article');
            return url;
          }
          async function bytesAt(raw) {
            const url = sourceURL(raw);
            const bytes = Buffer.from(await (await remote(url)).arrayBuffer());
            if (bytes.length > 20000000) throw new Error('Source exceeds 20 MB bound');
            const expected = url.searchParams.get('md5');
            if (expected && digest(bytes, 'md5') !== expected.toLowerCase()) throw new Error('NLM metadata MD5 mismatch');
            return bytes;
          }
          async function api(endpoint, method = 'GET', body) {
            const r = await fetch(`https://api.github.com/repos/${repository}/${endpoint}`, {
              method, signal: AbortSignal.timeout(60000),
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            if (!r.ok) throw new Error(`GitHub ${method} ${endpoint}: HTTP ${r.status}`);
            return r.json();
          }
          async function main() {
            if (repository !== 'bl4ckb4ll/blackball' || branch !== 'notes/professional-class-fast-track-20261012') throw new Error('Unexpected destination');
            if (process.platform !== 'linux' || !/^ID=ubuntu$/m.test(fs.readFileSync('/etc/os-release', 'utf8'))) throw new Error('Observed Ubuntu runner required');
            const preflight = spawnSync('pdftotext', ['-v'], { encoding: 'utf8' });
            if (preflight.error && preflight.error.code === 'ENOENT') {
              execFileSync('sudo', ['apt-get', 'update', '-qq'], { stdio: 'inherit' });
              execFileSync('sudo', ['apt-get', 'install', '-y', '--no-install-recommends', 'poppler-utils'], { stdio: 'inherit' });
            } else if (preflight.status !== 0) throw new Error('PDF reader preflight failed');
            // Current NLM distribution: https://pmc.ncbi.nlm.nih.gov/tools/pmcaws/
            // Legacy OA API and FTP article packages were retired in August 2026.
            const listingURL = `${origin}/?list-type=2&prefix=PMC8924719.&delimiter=%2F&max-keys=100`;
            const listing = await (await remote(listingURL)).text();
            if (/<IsTruncated>true<\/IsTruncated>/.test(listing)) throw new Error('Unexpectedly truncated single-article version listing');
            const prefixes = [...listing.matchAll(/<CommonPrefixes>\s*<Prefix>(PMC8924719\.\d+\/)<\/Prefix>\s*<\/CommonPrefixes>/g)].map(m => m[1]);
            if (!prefixes.length || prefixes.length > 10) throw new Error('No bounded article-version inventory');
            const inspected = [];
            const candidates = [];
            for (const prefix of prefixes) {
              const metadataURL = `${origin}/${prefix}${prefix.slice(0, -1)}.json`;
              const metadata = await (await remote(metadataURL)).json();
              inspected.push({ metadata_url: metadataURL, metadata });
              const cc = String(metadata.license_code).toLowerCase().replace(/[ _]/g, '-');
              if (metadata.doi !== doi) throw new Error('DOI mismatch in NLM metadata');
              if (String(metadata.is_manuscript).toLowerCase() === 'yes') continue;
              if (String(metadata.is_retracted).toLowerCase() === 'yes') throw new Error('NLM flags this source as retracted; manual review required');
              if (!/^cc-by(?:-[1-4]\.0)?$/.test(cc)) throw new Error(`Unqualified license: ${metadata.license_code}`);
              if (metadata.pdf_url) candidates.push({ metadataURL, metadata });
            }
            if (candidates.length !== 1) throw new Error(`Expected one licensed publisher PDF, found ${candidates.length}; do not choose by version number alone`);
            const { metadataURL, metadata } = candidates[0];
            const pdf = await bytesAt(metadata.pdf_url);
            if (pdf.length < 1000 || pdf.subarray(0, 5).toString() !== '%PDF-' || !pdf.subarray(-4096).includes(Buffer.from('%%EOF'))) throw new Error('Not a complete PDF response');
            const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'blackball-medical-'));
            try {
              const local = path.join(tmp, 'source.pdf');
              fs.writeFileSync(local, pdf);
              const info = execFileSync('pdfinfo', [local], { encoding: 'utf8' });
              const extracted = execFileSync('pdftotext', ['-layout', local, '-'], { encoding: 'utf8', maxBuffer: 10000000 });
              const match = info.match(/^Pages:\s+(\d+)/m);
              const pages = match ? Number(match[1]) : 0;
              const compact = extracted.replace(/\s+/g, ' ');
              if (pages !== 5 || !compact.includes(doi) || !compact.includes('Socioeconomic Diversity of the Matriculating US Medical Student Body')) throw new Error(`PDF identity check failed; observed pages=${pages}`);
              if (!/CC[ -]?BY\s+License|Creative Commons Attribution/i.test(compact)) throw new Error('Embedded article-specific CC BY grant absent');
              const pdfPath = `${folder}/shahriar-et-al-2022.pdf`;
              const receipt = {
                schema: 'blackball-source-archive-v1', state: 'ARCHIVED', title: metadata.title,
                doi, pmcid: 'PMC8924719', publication_date: '2022-03-15',
                source_url: String(sourceURL(metadata.pdf_url)), metadata_url: metadataURL,
                license: metadata.license_code, license_evidence: 'NLM article-version metadata and matching original PDF both contain an explicit CC BY grant.',
                license_terms: 'https://jamanetwork.com/pages/cc-by-license-permissions', copyright: '2022 Shahriar AA et al.',
                changes_to_pdf: 'none', pdf_path: pdfPath, pages, bytes: pdf.length, sha256: digest(pdf),
                metadata_md5: sourceURL(metadata.pdf_url).searchParams.get('md5'),
                retrieved_at: new Date().toISOString(), acquisition_workflow_commit: process.env.GITHUB_SHA,
                acquisition_run: `https://github.com/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                superseded_failed_runs: [38336629453, 38337135319],
                distribution_documentation: 'https://pmc.ncbi.nlm.nih.gov/tools/pmcaws/',
                checks: { signature: 'PASS', pdf_reader: 'PASS', page_count: 'PASS', title: 'PASS', doi: 'PASS', metadata_license: 'PASS', embedded_license: 'PASS' },
                evidence_boundary: 'Original PDF acquisition and identity verification, not survey replication or independent ai-ci acceptance. No supplemental PDF or law-report reproduction is included.'
              };
              const attribution = '# Attribution and archival notice\n\nShahriar AA, Puram VV, Miller JM, Sagi V, Castañón-Gonzalez LA, Prasad S, Crichlow R. *Socioeconomic Diversity of the Matriculating US Medical Student Body by Race, Ethnicity, and Sex, 2017-2019*. JAMA Network Open. 2022;5(3):e222621. https://doi.org/' + doi + '\n\n© 2022 Shahriar AA et al. CC BY. Terms: https://jamanetwork.com/pages/cc-by-license-permissions . The original PDF is unchanged. source.extracted.txt is a mechanical pdftotext extraction with page breaks and possible layout errors, not a different source.\n\nAcquired from NIH NLM NCBI PubMed Central Article Datasets on AWS; https://registry.opendata.aws/ncbi-pmc . This dated research snapshot does not necessarily reflect the most current or accurate NLM data. Neither the authors nor NLM/NIH/HHS endorse Blackball or its annotations. The metadata and archive-receipt.json preserve acquisition identity and hashes.\n\n[Annotations](../../../sources/medical-student-socioeconomic-diversity/2022/README.md)\n';
              const files = [[pdfPath, pdf], [`${folder}/archive-receipt.json`, Buffer.from(JSON.stringify(receipt, null, 2) + '\n')], [`${folder}/nlm-metadata.json`, Buffer.from(JSON.stringify(inspected, null, 2) + '\n')], [`${folder}/ATTRIBUTION.md`, Buffer.from(attribution)], [`${folder}/source.extracted.txt`, Buffer.from(extracted)]];
              const entries = [];
              for (const [filename, data] of files) {
                const blob = await api('git/blobs', 'POST', { content: data.toString('base64'), encoding: 'base64' });
                entries.push({ path: filename, mode: '100644', type: 'blob', sha: blob.sha });
              }
              let committed;
              for (let attempt = 0; attempt < 3; attempt++) {
                const ref = await api(`git/ref/heads/${branch}`);
                const parent = await api(`git/commits/${ref.object.sha}`);
                const current = await api(`git/trees/${parent.tree.sha}?recursive=1`);
                if (current.truncated) throw new Error('Cannot verify paths against a truncated tree');
                for (const entry of entries) {
                  const existing = current.tree.find(e => e.path === entry.path);
                  if (existing && existing.sha !== entry.sha) throw new Error(`Refusing to overwrite existing archive object: ${entry.path}`);
                }
                const tree = await api('git/trees', 'POST', { base_tree: parent.tree.sha, tree: entries });
                const commit = await api('git/commits', 'POST', { message: 'Archive original CC-BY medical-diversity PDF from verified NLM metadata', tree: tree.sha, parents: [ref.object.sha] });
                try { await api(`git/refs/heads/${branch}`, 'PATCH', { sha: commit.sha, force: false }); committed = commit.sha; break; }
                catch (e) { if (attempt === 2) throw e; }
              }
              if (!committed) throw new Error('Archive commit not published');
              const tree = await api(`git/trees/${(await api(`git/commits/${committed}`)).tree.sha}?recursive=1`);
              for (const entry of entries) if (!tree.tree.some(e => e.path === entry.path && e.sha === entry.sha)) throw new Error('Published tree verification failed');
              const summary = `ARCHIVED commit=${committed}\nPDF=${pdfPath}\nSHA256=${receipt.sha256}\nPAGES=${pages}\nNo law-report reproduction or merge performed.\n`;
              console.log(summary); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            } finally { fs.rmSync(tmp, { recursive: true, force: true }); }
          }
          main().catch(e => { console.error(e.message); process.exitCode = 1; });
