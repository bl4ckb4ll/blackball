name: Preserve licensed medical article objects

on:
  push:
    branches: [notes/professional-class-fast-track-20261012]
    paths: [.github/workflows/archive-medical-diversity.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-medical-diversity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'bl4ckb4ll/blackball' && github.ref == 'refs/heads/notes/professional-class-fast-track-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve the five observed source objects and record their exact formats
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          'use strict';
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const repository = process.env.GITHUB_REPOSITORY;
          const branch = process.env.GITHUB_REF_NAME;
          const origin = 'https://pmc-oa-opendata.s3.amazonaws.com';
          const prefix = 'PMC8924719.1/';
          const folder = 'texts/medical-student-socioeconomic-diversity/2022';
          const doi = '10.1001/jamanetworkopen.2022.2621';
          const sha256 = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const names = ['PMC8924719.1.json', 'PMC8924719.1.txt', 'PMC8924719.1.xml', 'jamanetwopen-e222621-g001.jpg', 'jamanetwopen-e222621-s001.pdf'];
          async function remote(url) {
            const response = await fetch(url, { signal: AbortSignal.timeout(45000) });
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
            return response;
          }
          async function api(endpoint, method = 'GET', body) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${endpoint}`, {
              method, signal: AbortSignal.timeout(45000), headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            if (!response.ok) throw new Error(`GitHub ${endpoint}: HTTP ${response.status}`);
            return response.json();
          }
          async function main() {
            if (repository !== 'bl4ckb4ll/blackball' || branch !== 'notes/professional-class-fast-track-20261012') throw new Error('Unexpected destination');
            const listingURL = `${origin}/?list-type=2&prefix=${prefix}&max-keys=100`;
            const listing = await (await remote(listingURL)).text();
            if (/<IsTruncated>true<\/IsTruncated>/.test(listing)) throw new Error('Truncated inventory');
            const keys = [...listing.matchAll(/<Key>([^<]+)<\/Key>/g)].map(m => m[1]);
            if (keys.length !== names.length || names.some(name => !keys.includes(prefix + name))) throw new Error('NLM inventory changed; review before acquiring');
            const source = new Map();
            for (const name of names) {
              const bytes = Buffer.from(await (await remote(`${origin}/${prefix}${name}`)).arrayBuffer());
              if (bytes.length === 0 || bytes.length > 20000000) throw new Error('Empty or oversized source object');
              source.set(name, bytes);
            }
            const metadata = JSON.parse(source.get('PMC8924719.1.json').toString('utf8'));
            console.log('Observed NLM metadata:', JSON.stringify(metadata));
            const xml = source.get('PMC8924719.1.xml').toString('utf8');
            const text = source.get('PMC8924719.1.txt').toString('utf8');
            if (metadata.doi !== doi || !xml.includes(doi) || !xml.includes('Socioeconomic Diversity of the Matriculating US Medical Student Body')) throw new Error('Article identity mismatch');
            if (!text.includes('Socioeconomic Diversity')) throw new Error('Plaintext identity mismatch');
            if (String(metadata.is_retracted).toLowerCase() === 'yes') throw new Error('Retraction flag requires review');
            const licenses = [...xml.matchAll(/<license\b[\s\S]*?<\/license>/g)].map(match => match[0]);
            const license = licenses.find(value => /creativecommons\.org\/licenses\/by\/(?:[1-4]\.0)\/?|CC[ -]?BY\s+License|Creative Commons Attribution/i.test(value));
            if (!license) throw new Error('Explicit CC BY grant absent from article XML; no archive writes permitted');
            if (source.get('jamanetwopen-e222621-s001.pdf').subarray(0, 5).toString() !== '%PDF-') throw new Error('Supplement is not PDF bytes');
            const figure = source.get('jamanetwopen-e222621-g001.jpg');
            if (figure[0] !== 255 || figure[1] !== 216) throw new Error('Figure is not JPEG bytes');
            const objects = names.map(name => ({ path: `${folder}/${name}`, source_url: `${origin}/${prefix}${name}`, bytes: source.get(name).length, sha256: sha256(source.get(name)), changes: 'none' }));
            const receipt = {
              schema: 'blackball-source-archive-v1', state: 'ARTICLE_XML_TEXT_FIGURE_AND_SUPPLEMENT_ARCHIVED',
              doi, pmcid: 'PMC8924719', article_version: 1, license: 'CC BY', license_evidence: { source: `${origin}/${prefix}PMC8924719.1.xml`, element: license },
              original_main_pdf_archived: false, main_pdf_reason: 'The complete observed NLM article inventory contains only the supplemental PDF, not the five-page main-article PDF. Publisher retrieval attempts failed.',
              supplemental_pdf_archived: true, supplemental_pdf_reviewed: false, objects,
              retrieved_at: new Date().toISOString(), inventory_url: listingURL,
              workflow_commit: process.env.GITHUB_SHA, workflow_run: `https://github.com/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              earlier_failed_runs: [38336629453, 38337135319, 38337673662, 38338428720],
              evidence_boundary: 'Archival receipt for unchanged source bytes, not a survey replication, complete supplementary-method review, independent acceptance, or copy of the law report. Do not call the supplemental PDF the main article.'
            };
            const attribution = '# Attribution and source formats\n\nShahriar AA, Puram VV, Miller JM, Sagi V, Castañón-Gonzalez LA, Prasad S, Crichlow R. Socioeconomic Diversity of the Matriculating US Medical Student Body by Race, Ethnicity, and Sex, 2017–2019. JAMA Network Open. 2022;5(3):e222621. https://doi.org/' + doi + '\n\n© 2022 Shahriar AA et al. CC BY. Article-specific permission is preserved in the XML license element and archive-receipt.json. Source objects are unchanged. Their original filenames are retained so that internal figure and supplemental references continue to resolve.\n\nPMC8924719.1.xml and PMC8924719.1.txt contain the main article; jamanetwopen-e222621-g001.jpg is its figure; jamanetwopen-e222621-s001.pdf is the supplementary methods, NOT the five-page main article PDF. The main PDF was not acquired.\n\nAcquired from NIH NLM NCBI PubMed Central Article Datasets on AWS, https://registry.opendata.aws/ncbi-pmc . This dated snapshot does not necessarily reflect the most current or accurate NLM data. Neither the authors nor NLM/NIH/HHS endorse Blackball or its commentary.\n\n[Detailed original annotations](../../../sources/medical-student-socioeconomic-diversity/2022/README.md)\n';
            const files = [...source].map(([name, bytes]) => [`${folder}/${name}`, bytes]);
            files.push([`${folder}/archive-receipt.json`, Buffer.from(JSON.stringify(receipt, null, 2) + '\n')], [`${folder}/ATTRIBUTION.md`, Buffer.from(attribution)]);
            const entries = [];
            for (const [filename, bytes] of files) {
              const blob = await api('git/blobs', 'POST', { content: bytes.toString('base64'), encoding: 'base64' });
              entries.push({ path: filename, mode: '100644', type: 'blob', sha: blob.sha });
            }
            let committed;
            for (let attempt = 0; attempt < 3; attempt++) {
              const reference = await api(`git/ref/heads/${branch}`);
              const parent = await api(`git/commits/${reference.object.sha}`);
              const current = await api(`git/trees/${parent.tree.sha}?recursive=1`);
              if (current.truncated) throw new Error('Truncated repository tree');
              for (const entry of entries) {
                const old = current.tree.find(item => item.path === entry.path);
                if (old && old.sha !== entry.sha) throw new Error(`Refusing to overwrite archive object ${entry.path}`);
              }
              const tree = await api('git/trees', 'POST', { base_tree: parent.tree.sha, tree: entries });
              const commit = await api('git/commits', 'POST', { message: 'Archive licensed medical article XML, text, figure and supplement with exact format receipt', tree: tree.sha, parents: [reference.object.sha] });
              try { await api(`git/refs/heads/${branch}`, 'PATCH', { sha: commit.sha, force: false }); committed = commit.sha; break; }
              catch (error) { if (attempt === 2) throw error; }
            }
            if (!committed) throw new Error('No archive commit published');
            console.log('ARCHIVE RESULT:', JSON.stringify({ commit: committed, receipt }));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Archived main article as XML/text, plus figure and supplemental PDF.\nCommit: ${committed}\nMain-article PDF NOT archived.\n`);
            console.log('::warning::The five-page main-article PDF is not archived; do not substitute the supplemental PDF.');
          }
          main().catch(error => { console.error(error.message); process.exitCode = 1; });
