name: Fetch SBF public-domain court documents

on:
  push:
    branches:
      - sources/united-states-v-bankman-fried
    paths:
      - .github/workflows/fetch-sbf-court-docs.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      ROOT: sources/united-states-v-bankman-fried/pdf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch public-domain primary documents
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          git config user.name "blackball source sync"
          git config user.email "blackball-source-sync@users.noreply.github.com"
          mkdir -p "$ROOT"
          : > "$ROOT/FETCHED_FROM.tsv"
          : > "$ROOT/FETCH_FAILURES.tsv"

          fetch_pdf() {
            local filename="$1"
            shift
            local dest="$ROOT/$filename"
            local tmp="$dest.tmp"
            local url
            rm -f "$tmp"
            for url in "$@"; do
              echo "fetching $filename from $url"
              if curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
                   --connect-timeout 30 --max-time 300 \
                   --user-agent 'Mozilla/5.0 (compatible; blackball-public-domain-archive/1.0)' \
                   "$url" -o "$tmp"; then
                if [[ "$(head -c 5 "$tmp" || true)" == "%PDF-" ]]; then
                  mv "$tmp" "$dest"
                  printf '%s\t%s\n' "$filename" "$url" >> "$ROOT/FETCHED_FROM.tsv"
                  return 0
                fi
                echo "not a PDF: $url" >&2
              fi
              rm -f "$tmp"
            done
            printf '%s\t%s\n' "$filename" "all configured sources failed" >> "$ROOT/FETCH_FAILURES.tsv"
            return 0
          }

          fetch_pdf 2022-12-original-indictment.pdf \
            'https://www.justice.gov/d9/press-releases/attachments/2022/12/13/u.s._v._bankman-fried_indictment_0.pdf' \
            'https://storage.courtlistener.com/recap/gov.uscourts.nysd.590940/gov.uscourts.nysd.590940.1.0.pdf'

          fetch_pdf 2023-03-28-s5-superseding-indictment-dkt-115.pdf \
            'https://www.courthousenews.com/wp-content/uploads/2023/03/bankman-fried-superseding-indictmentOCR.pdf' \
            'https://storage.courtlistener.com/recap/gov.uscourts.nysd.590940/gov.uscourts.nysd.590940.115.0.pdf'

          fetch_pdf 2023-08-14-s6-trial-indictment-dkt-202.pdf \
            'https://www.courthousenews.com/wp-content/uploads/2023/08/sbf-august-2023-superseding-indictment.pdf' \
            'https://storage.courtlistener.com/recap/gov.uscourts.nysd.590940/gov.uscourts.nysd.590940.202.0.pdf'

          fetch_pdf 2026-03-11-government-opposition-new-trial-dkt-587.pdf \
            'https://cdn.arstechnica.net/wp-content/uploads/2026/03/US-v-Bankman-Fried-DOJ-Motion-to-Deny-New-Trial-3-11-26.pdf' \
            'https://storage.courtlistener.com/recap/gov.uscourts.nysd.590940/gov.uscourts.nysd.590940.587.0.pdf'

          fetch_pdf 2026-04-28-order-denying-new-trial-dkt-595.pdf \
            'https://business.cch.com/srd/2026-04-28-16-23-33-363-590940_2246_1042926.pdf' \
            'https://storage.courtlistener.com/recap/gov.uscourts.nysd.590940/gov.uscourts.nysd.590940.595.0.pdf'

          fetch_pdf 2026-06-12-second-circuit-opinion-24-961-cr.pdf \
            'https://ww3.ca2.uscourts.gov/decisions/OPN/24-961_opn.pdf'

          find "$ROOT" -maxdepth 1 -type f -name '*.pdf' -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            | sed "s#  $ROOT/#  #" > "$ROOT/SHA256SUMS"

          git add "$ROOT"
          if ! git diff --cached --quiet; then
            git commit -m '[source-sync] Mirror public-domain SBF court PDFs'
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              sleep 2
            done
          fi

          if [[ -s "$ROOT/FETCH_FAILURES.tsv" ]]; then
            echo 'One or more configured PDF sources failed:' >&2
            cat "$ROOT/FETCH_FAILURES.tsv" >&2
            exit 1
          fi
