name: Fetch Mayhew 1851 source lineage

on:
  push:
    branches:
      - mayhew-london-labour-corpus
    paths:
      - .github/workflows/fetch-mayhew-1851.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      ROOT: sources/henry-mayhew/london-labour-and-the-london-poor/internet-archive-1851
      RELEASE_TAG: mayhew-london-labour-1851-source-blobs
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          git config user.name "blackball corpus sync"
          git config user.email "blackball-corpus@users.noreply.github.com"
          mkdir -p "$ROOT"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_REF_NAME" \
              --title "Mayhew — London Labour and the London Poor — 1851 source blobs" \
              --notes "Oversized public-domain files from the 1851 Newbold/Wellcome source lineage."
          fi

      - name: Mirror the 1851 three-volume issue
        shell: bash
        run: |
          set -euo pipefail

          urlquote() {
            python3 - "$1" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe='/'))
          PY
          }

          sync_item() {
            local vol="$1" id="$2"
            local dest="$ROOT/volume-$vol/$id"
            local meta="$dest/metadata-api.json"
            local large="$ROOT/large-files-1851.tsv"
            mkdir -p "$dest"
            touch "$large"

            curl --fail --location --retry 5 --retry-delay 4 \
              "https://archive.org/metadata/$id" -o "$meta"
            : > "$dest/SHA256SUMS"

            jq -r '.files[] | select(.name != null) | [.name, ((.size // "0")|tostring)] | @tsv' "$meta" |
            while IFS=$'\t' read -r name size; do
              [ -n "$name" ] || continue
              size="${size:-0}"
              [[ "$size" =~ ^[0-9]+$ ]] || size=0
              local quoted url
              quoted="$(urlquote "$name")"
              url="https://archive.org/download/$id/$quoted"

              if (( size >= 99000000 )); then
                local asset tmp sha
                asset="1851-volume-${vol}--${id}--$(basename "$name")"
                tmp="$RUNNER_TEMP/$asset"
                curl --fail --location --retry 6 --retry-delay 5 "$url" -o "$tmp"
                sha="$(sha256sum "$tmp" | awk '{print $1}')"
                gh release upload "$RELEASE_TAG" "$tmp#$asset" --clobber
                printf '%s\t%s\t%s\t%s\t%s\n' "$vol" "$id/$name" "$size" "$sha" \
                  "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}" \
                  >> "$large"
                rm -f "$tmp"
              else
                mkdir -p "$(dirname "$dest/$name")"
                curl --fail --location --retry 6 --retry-delay 5 "$url" -o "$dest/$name"
                (cd "$dest" && sha256sum "$name") >> "$dest/SHA256SUMS"
              fi
            done

            git add "$ROOT"
            git commit -m "[corpus-sync] Mirror Mayhew 1851 volume $vol source representations"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          }

          # Wellcome's surviving 1851 issue: nos. 1–63, comprising volume I and
          # parts of volumes II–III, all that was issued in this lineage.
          sync_item 1 b20415606_001
          sync_item 2 b20415606_002
          sync_item 3 b20415606_003

      - name: Write 1851 inventory
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Generated 1851 source-lineage inventory"
            echo
            find "$ROOT" -type f ! -name INVENTORY.md -printf '%s\t%p\n' | sort -k2
          } > "$ROOT/INVENTORY.md"
          git add "$ROOT/INVENTORY.md"
          if ! git diff --cached --quiet; then
            git commit -m "[corpus-sync] Record Mayhew 1851 inventory"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
